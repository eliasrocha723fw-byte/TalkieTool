<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TalkieTool Mobile</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --card-bg: #161618;
            --accent-green: #00ea62;
            --accent-red: #ff3b30;
            --text-main: #ffffff;
            --text-sub: #a1a1a6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
            padding: 20px;
            justify-content: space-between;
        }

        .screen.active {
            display: flex;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 50px;
            height: 50px;
            background-color: var(--accent-green);
            color: #000;
            font-weight: bold;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            cursor: pointer;
            position: relative;
        }

        .btn-green {
            background-color: var(--accent-green);
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 16px;
            padding: 18px;
            font-size: 18px;
            width: 100%;
            cursor: pointer;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            font-weight: bold;
            border-radius: 12px;
            padding: 14px;
            width: 100%;
            cursor: pointer;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            margin-top: 15px;
        }

        .text-input {
            width: 100%;
            background-color: #000;
            border: 1px solid #333;
            color: var(--text-main);
            font-size: 16px;
            padding: 12px;
            border-radius: 12px;
            margin-top: 8px;
            outline: none;
        }

        .code-input-container {
            display: flex;
            justify-content: center;
            margin: 15px 0;
        }

        .code-input {
            background-color: #000;
            border: 1px solid #333;
            color: var(--accent-green);
            font-size: 28px;
            letter-spacing: 10px;
            text-align: center;
            padding: 12px;
            border-radius: 12px;
            width: 100%;
            outline: none;
        }

        .room-code-display {
            font-size: 36px;
            font-weight: 900;
            color: var(--accent-green);
            text-align: center;
        }

        .grid-members {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 20px;
            max-height: 50vh;
            overflow-y: auto;
        }

        .member-card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 3px solid transparent;
            min-height: 120px;
            transition: all 0.1s ease;
        }

        /* EFECTO DE ILUMINACIÓN DE USUARIO */
        .member-card.speaking {
            border-color: #00ea62 !important;
            box-shadow: 0 0 30px rgba(0, 234, 98, 0.9) !important;
            transform: scale(1.05);
        }

        .ptt-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .btn-ptt {
            width: 110px;
            height: 110px;
            border-radius: 35px;
            background-color: var(--card-bg);
            border: 3px solid var(--accent-green);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 234, 98, 0.15);
            touch-action: none;
            transition: all 0.1s ease;
        }

        .btn-ptt.active {
            background-color: var(--accent-green) !important;
            box-shadow: 0 0 45px rgba(0, 234, 98, 1) !important;
            transform: scale(0.92);
        }

        .btn-ptt svg {
            width: 40px;
            height: 40px;
            fill: var(--accent-green);
            pointer-events: none;
        }

        .btn-ptt.active svg {
            fill: #000 !important;
        }

        #status-msg {
            font-size: 11px;
            color: var(--accent-green);
            text-align: center;
            margin-top: 5px;
        }

        /* INDICADOR DE MANTENER PANTALLA ACTIVA */
        .wakelock-badge {
            display: inline-block;
            font-size: 10px;
            background: rgba(0, 234, 98, 0.15);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
            padding: 3px 8px;
            border-radius: 10px;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <!-- 1. PANTALLA PRINCIPAL -->
    <div id="screen-home" class="screen active">
        <div>
            <div class="header">
                <div class="user-profile">
                    <div id="user-avatar" class="avatar" onclick="document.getElementById('photo-input').click()">M</div>
                    <input type="file" id="photo-input" accept="image/*" style="display: none;" onchange="handlePhotoUpload(event)">
                    
                    <div>
                        <div style="color: var(--text-sub); font-size: 10px; font-weight:bold;">CONFIGURACIÓN RÁPIDA</div>
                        <input type="text" id="user-name-input" class="text-input" value="MønKingg" onchange="updateProfileName(this.value)">
                    </div>
                </div>
            </div>

            <div style="margin-top: 15px;">
                <p style="color: var(--accent-green); font-size: 12px; font-weight: bold; letter-spacing: 1px;">SALA RÁPIDA</p>
                <h1 style="font-size: 24px; font-weight: 800; margin-top: 5px;">Hablá con tu squad en segundos.</h1>
            </div>

            <button class="btn-green" style="margin-top: 20px;" onclick="createRoom()">CREAR SALA<br><span style="font-size: 11px; font-weight: normal;">Generá un código único de 4 dígitos</span></button>

            <div class="card">
                <p style="color: var(--text-sub); font-size: 12px; font-weight: bold; text-align: center;">UNIRSE POR CÓDIGO</p>
                <div class="code-input-container">
                    <input type="number" id="room-code-input" class="code-input" placeholder="0000" oninput="if(this.value.length > 4) this.value = this.value.slice(0,4);">
                </div>
                <button class="btn-outline" onclick="joinRoom()">ENTRAR A LA SALA</button>
            </div>
        </div>
    </div>

    <!-- 2. PANTALLA SALA -->
    <div id="screen-room" class="screen">
        <div>
            <div class="header">
                <button style="background:none; border:none; color:#fff; font-size:20px;" onclick="leaveRoom()">✕</button>
                <div style="text-align: center;">
                    <p style="font-size: 10px; color: var(--text-sub);">SALA</p>
                    <div id="display-room-code" class="room-code-display">0000</div>
                    <div id="status-msg">Listo para conectar</div>
                    <div id="wakelock-status" class="wakelock-badge">☀️ Pantalla Activa</div>
                </div>
                <button style="background:none; border:none; color:#fff; font-size:20px;">🔊</button>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px;">
                <span id="member-count" style="color: var(--text-sub); font-size: 14px;">1 miembro • Comparte el código</span>
                <button style="background:none; border:none; color:var(--accent-green); font-size: 12px; font-weight:bold;" onclick="copyCode()">📋 COPIAR</button>
            </div>

            <div id="members-grid" class="grid-members"></div>
        </div>

        <div class="ptt-container">
            <div class="btn-ptt" id="ptt-button">
                <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
            </div>
            <p style="font-size: 12px; color: var(--text-sub);">Mantené presionado para hablar</p>
        </div>
    </div>

    <audio id="remote-audio" autoplay playsinline></audio>
    <audio id="local-audio-test" autoplay playsinline></audio>

    <script>
        let currentUser = { name: "MønKingg", photo: null };
        let peer = null;
        let localStream = null;
        let currentCode = "";
        let membersMap = new Map();
        let wakeLock = null;

        // MANTENER PANTALLA ENCENDIDA
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    document.getElementById('wakelock-status').style.display = 'inline-block';
                }
            } catch (err) {
                console.log("WakeLock error:", err);
            }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release();
                wakeLock = null;
            }
        }

        // Si el usuario vuelve a ver la app, reactivar el bloqueo
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function updateProfileName(val) {
            if (val.trim()) {
                currentUser.name = val.trim();
                if (!currentUser.photo) {
                    document.getElementById('user-avatar').innerText = currentUser.name.charAt(0).toUpperCase();
                }
            }
        }

        function handlePhotoUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentUser.photo = e.target.result;
                    const avatarDiv = document.getElementById('user-avatar');
                    avatarDiv.style.backgroundImage = `url(${currentUser.photo})`;
                    avatarDiv.innerText = '';
                };
                reader.readAsDataURL(file);
            }
        }

        async function initMic() {
            if (localStream) return;
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                if (localStream && localStream.getAudioTracks().length > 0) {
                    localStream.getAudioTracks()[0].enabled = false;
                    const localAudio = document.getElementById('local-audio-test');
                    localAudio.srcObject = localStream;
                    localAudio.volume = 0.3;
                }
            } catch (err) {
                console.log("Error de mic:", err);
            }
        }

        function createRoom() {
            currentCode = Math.floor(1000 + Math.random() * 9000).toString();
            document.getElementById('display-room-code').innerText = currentCode;
            showScreen('screen-room');
            startPeerConnection("room-" + currentCode);
            initMic();
            requestWakeLock();
        }

        function joinRoom() {
            const input = document.getElementById('room-code-input').value;
            if (input.length !== 4) {
                alert("Ingresa un código de 4 dígitos.");
                return;
            }

            currentCode = input;
            document.getElementById('display-room-code').innerText = currentCode;
            showScreen('screen-room');
            startPeerConnection("user-" + Math.floor(1000 + Math.random() * 9000));
            initMic();
            requestWakeLock();
        }

        async function startPeerConnection(peerId) {
            membersMap.clear();
            membersMap.set('self', { name: currentUser.name, photo: currentUser.photo, isSelf: true });
            renderMembers();

            if (peer) peer.destroy();

            peer = new Peer(peerId);

            peer.on('open', () => {
                document.getElementById('status-msg').innerText = "Conectado";
                document.getElementById('status-msg').style.color = "var(--accent-green)";

                if (peerId.startsWith("user-")) {
                    let call = peer.call("room-" + currentCode, localStream);
                    let conn = peer.connect("room-" + currentCode);

                    if (conn) {
                        conn.on('open', () => {
                            conn.send({ type: 'profile', user: { name: currentUser.name, photo: currentUser.photo } });
                        });
                        conn.on('data', (data) => {
                            if (data.type === 'profile') {
                                membersMap.set('host', { name: data.user.name, photo: data.user.photo, isSelf: false });
                                renderMembers();
                            }
                        });
                    }
                    if (call) handleCall(call);
                }
            });

            peer.on('call', (call) => {
                call.answer(localStream);
                handleCall(call);
            });

            peer.on('connection', (conn) => {
                conn.on('data', (data) => {
                    if (data.type === 'profile') {
                        membersMap.set(conn.peer, { name: data.user.name, photo: data.user.photo, isSelf: false });
                        renderMembers();
                        conn.send({ type: 'profile', user: { name: currentUser.name, photo: currentUser.photo } });
                    }
                });
            });

            setupPTT();
        }

        function handleCall(call) {
            call.on('stream', (remoteStream) => {
                const audio = document.getElementById('remote-audio');
                audio.srcObject = remoteStream;
                audio.play().catch(e => console.log("Audio block", e));
            });
        }

        function renderMembers() {
            const grid = document.getElementById('members-grid');
            grid.innerHTML = "";

            membersMap.forEach((member, key) => {
                const card = document.createElement('div');
                card.className = 'member-card';
                card.id = `card-${key}`;

                let avatarHTML = member.photo 
                    ? `<div class="avatar" style="margin-bottom: 8px; background-image: url(${member.photo});"></div>`
                    : `<div class="avatar" style="margin-bottom: 8px;">${member.name.charAt(0).toUpperCase()}</div>`;

                let subtext = member.isSelf ? `<div style="font-size: 10px; color: var(--text-sub); margin-top:2px;">TÚ</div>` : '';

                card.innerHTML = `${avatarHTML}<div style="font-size: 15px; font-weight: bold; text-align: center;">${member.name}</div>${subtext}`;
                grid.appendChild(card);
            });

            document.getElementById('member-count').innerText = `${membersMap.size} ${membersMap.size === 1 ? 'miembro' : 'miembros'} • Comparte el código`;
        }

        function setupPTT() {
            const pttBtn = document.getElementById('ptt-button');

            const startTalking = (e) => {
                if (e) e.preventDefault();

                // Efecto visual directo
                pttBtn.classList.add('active');
                const selfCard = document.getElementById('card-self');
                if (selfCard) {
                    selfCard.classList.add('speaking');
                }

                // Encender micrófono
                if (localStream && localStream.getAudioTracks()[0]) {
                    localStream.getAudioTracks()[0].enabled = true;
                }
            };

            const stopTalking = (e) => {
                if (e) e.preventDefault();

                // Apagar efecto visual
                pttBtn.classList.remove('active');
                const selfCard = document.getElementById('card-self');
                if (selfCard) {
                    selfCard.classList.remove('speaking');
                }

                // Apagar micrófono
                if (localStream && localStream.getAudioTracks()[0]) {
                    localStream.getAudioTracks()[0].enabled = false;
                }
            };

            pttBtn.addEventListener('touchstart', startTalking, { passive: false });
            pttBtn.addEventListener('touchend', stopTalking, { passive: false });
            pttBtn.addEventListener('mousedown', startTalking);
            pttBtn.addEventListener('mouseup', stopTalking);
        }

        function leaveRoom() {
            if (peer) peer.destroy();
            releaseWakeLock();
            showScreen('screen-home');
        }

        function copyCode() {
            navigator.clipboard.writeText(currentCode);
            alert("Código copiado: " + currentCode);
        }
    </script>
</body>
</html>
