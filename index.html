<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TalkieTool Mobile</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --card-bg: #161618;
            --accent-green: #00ea62;
            --accent-red: #ff3b30;
            --text-main: #ffffff;
            --text-sub: #a1a1a6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
            padding: 20px;
            justify-content: space-between;
        }

        .screen.active {
            display: flex;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 44px;
            height: 44px;
            background-color: var(--accent-green);
            color: #000;
            font-weight: bold;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        /* Botones */
        .btn-green {
            background-color: var(--accent-green);
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 16px;
            padding: 18px;
            font-size: 18px;
            width: 100%;
            cursor: pointer;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            font-weight: bold;
            border-radius: 12px;
            padding: 14px;
            width: 100%;
            cursor: pointer;
        }

        /* Pantalla Inicio */
        .card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            margin-top: 15px;
        }

        .code-input-container {
            display: flex;
            justify-content: center;
            margin: 15px 0;
        }

        .code-input {
            background-color: #000;
            border: 1px solid #333;
            color: var(--accent-green);
            font-size: 28px;
            letter-spacing: 10px;
            text-align: center;
            padding: 12px;
            border-radius: 12px;
            width: 80%;
        }

        /* Pantalla Sala */
        .room-code-display {
            font-size: 36px;
            font-weight: 900;
            color: var(--accent-green);
            text-align: center;
        }

        .grid-members {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 20px;
            max-height: 50vh;
            overflow-y: auto;
        }

        .member-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px solid transparent;
        }

        .member-card.speaking {
            border-color: var(--accent-green);
        }

        /* Botón PTT */
        .ptt-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .btn-ptt {
            width: 110px;
            height: 110px;
            border-radius: 35px;
            background-color: var(--card-bg);
            border: 3px solid var(--accent-green);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 234, 98, 0.2);
        }

        .btn-ptt:active {
            background-color: var(--accent-green);
            box-shadow: 0 0 30px rgba(0, 234, 98, 0.6);
        }

        .btn-ptt svg {
            width: 40px;
            height: 40px;
            fill: var(--accent-green);
        }

        .btn-ptt:active svg {
            fill: #000;
        }

        /* Ajustes UI Switch */
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #222;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 26px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333; transition: .3s; border-radius: 34px;
        }

        .slider:before {
            position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px;
            background-color: white; transition: .3s; border-radius: 50%;
        }

        input:checked + .slider { background-color: var(--accent-green); }
        input:checked + .slider:before { transform: translateX(20px); }
    </style>
</head>
<body>

    <!-- 1. PANTALLA INICIO -->
    <div id="screen-home" class="screen active">
        <div>
            <div class="header">
                <div class="user-profile">
                    <div class="avatar">M</div>
                    <div>
                        <div style="color: var(--text-sub); font-size: 12px;">HOLA</div>
                        <div style="font-weight: bold;">MønKingg</div>
                    </div>
                </div>
            </div>

            <div style="margin-top: 30px;">
                <p style="color: var(--accent-green); font-size: 12px; font-weight: bold; letter-spacing: 1px;">SALA RÁPIDA</p>
                <h1 style="font-size: 28px; font-weight: 800; margin-top: 5px;">Hablá con tu squad en segundos.</h1>
            </div>

            <button class="btn-green" style="margin-top: 25px;" onclick="createRoom()">CREAR SALA<br><span style="font-size: 11px; font-weight: normal;">Generá un código único de 4 dígitos</span></button>

            <div class="card">
                <p style="color: var(--text-sub); font-size: 12px; font-weight: bold; text-align: center;">UNIRSE POR CÓDIGO</p>
                <div class="code-input-container">
                    <input type="number" id="room-code-input" class="code-input" placeholder="0000" maxlength="4">
                </div>
                <button class="btn-outline" onclick="joinRoom()">ENTRAR A LA SALA</button>
            </div>
        </div>

        <button class="btn-outline" style="border-color: #333; color: #fff;" onclick="showScreen('screen-settings')">Ajustes de audio</button>
    </div>

    <!-- 2. PANTALLA SALA -->
    <div id="screen-room" class="screen">
        <div>
            <div class="header">
                <button style="background:none; border:none; color:#fff; font-size:20px;" onclick="leaveRoom()">✕</button>
                <div>
                    <p style="font-size: 10px; color: var(--text-sub); text-align: center;">SALA</p>
                    <div id="display-room-code" class="room-code-display">0000</div>
                </div>
                <button style="background:none; border:none; color:#fff; font-size:20px;">🔊</button>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px;">
                <span id="member-count" style="color: var(--text-sub); font-size: 14px;">1 miembro (Máx 6)</span>
                <button style="background:none; border:none; color:var(--accent-green); font-size: 12px; font-weight:bold;" onclick="copyCode()">📋 COPIAR</button>
            </div>

            <!-- Grilla para hasta 6 personas -->
            <div id="members-grid" class="grid-members">
                <div class="member-card">
                    <div class="avatar" style="margin-bottom: 8px;">M</div>
                    <div style="font-size: 14px; font-weight: bold;">MønKingg</div>
                    <div style="font-size: 10px; color: var(--text-sub);">TÚ</div>
                </div>
            </div>
        </div>

        <!-- Controles Push-To-Talk -->
        <div class="ptt-container">
            <div class="btn-ptt" id="ptt-button">
                <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
            </div>
            <p style="font-size: 12px; color: var(--text-sub);">Mantené presionado para hablar</p>
        </div>
    </div>

    <!-- 3. PANTALLA AJUSTES -->
    <div id="screen-settings" class="screen">
        <div>
            <div class="header" style="justify-content: flex-start; gap: 20px;">
                <button style="background:none; border:none; color:#fff; font-size:20px;" onclick="showScreen('screen-home')">←</button>
                <h2 style="font-size: 18px;">AJUSTES DE AUDIO</h2>
            </div>

            <div class="card" style="margin-top: 20px;">
                <div class="setting-row">
                    <div>
                        <div style="font-weight: bold;">Modo Competitivo</div>
                        <div style="font-size: 11px; color: var(--text-sub);">Latencia mínima sin efectos</div>
                    </div>
                    <label class="switch"><input type="checkbox" checked><span class="slider"></span></label>
                </div>
                <div class="setting-row">
                    <div>
                        <div style="font-weight: bold;">Cancelación de Ruido</div>
                        <div style="font-size: 11px; color: var(--text-sub);">Filtra sonido ambiental</div>
                    </div>
                    <label class="switch"><input type="checkbox" checked><span class="slider"></span></label>
                </div>
            </div>
        </div>
    </div>

    <!-- Audio Element para reproducir el canal -->
    <audio id="remote-audio" autoplay></audio>

    <script>
        let peer = null;
        let localStream = null;
        let currentCode = "";
        let connections = [];

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        async function initAudio() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: true, noiseSuppression: true } 
                });
                // Mute local stream por defecto (Push To Talk)
                localStream.getAudioTracks()[0].enabled = false;
            } catch (e) {
                alert("Permiso de micrófono requerido para continuar.");
            }
        }

        function createRoom() {
            currentCode = Math.floor(1000 + Math.random() * 9000).toString();
            setupPeer(currentCode);
        }

        function joinRoom() {
            const input = document.getElementById('room-code-input').value;
            if (input.length === 4) {
                currentCode = input;
                setupPeer("guest-" + Math.floor(Math.random() * 1000));
            } else {
                alert("Ingresa un código de 4 dígitos.");
            }
        }

        function setupPeer(id) {
            initAudio().then(() => {
                peer = new Peer(id);

                peer.on('open', (peerId) => {
                    document.getElementById('display-room-code').innerText = currentCode;
                    showScreen('screen-room');
                    setupPTT();

                    // Si se une como invitado, llamar al host
                    if (id.startsWith("guest-")) {
                        let call = peer.call(currentCode, localStream);
                        handleCall(call);
                    }
                });

                peer.on('call', (call) => {
                    call.answer(localStream);
                    handleCall(call);
                });
            });
        }

        function handleCall(call) {
            call.on('stream', (remoteStream) => {
                document.getElementById('remote-audio').srcObject = remoteStream;
                addMemberCard("Jugador " + (connections.length + 2));
            });
            connections.push(call);
            updateMemberCount();
        }

        function addMemberCard(name) {
            const grid = document.getElementById('members-grid');
            if (grid.children.length < 6) {
                const card = document.createElement('div');
                card.className = 'member-card';
                card.innerHTML = `<div class="avatar" style="margin-bottom: 8px;">J</div><div style="font-size: 14px; font-weight: bold;">${name}</div>`;
                grid.appendChild(card);
            }
        }

        function updateMemberCount() {
            document.getElementById('member-count').innerText = `${connections.length + 1} miembros (Máx 6)`;
        }

        function setupPTT() {
            const pttBtn = document.getElementById('ptt-button');
            
            const startTalking = () => {
                if (localStream) localStream.getAudioTracks()[0].enabled = true;
            };

            const stopTalking = () => {
                if (localStream) localStream.getAudioTracks()[0].enabled = false;
            };

            pttBtn.addEventListener('touchstart', startTalking);
            pttBtn.addEventListener('touchend', stopTalking);
            pttBtn.addEventListener('mousedown', startTalking);
            pttBtn.addEventListener('mouseup', stopTalking);
        }

        function leaveRoom() {
            if (peer) peer.destroy();
            location.reload();
        }

        function copyCode() {
            navigator.clipboard.writeText(currentCode);
            alert("Código copiado: " + currentCode);
        }
    </script>
</body>
  </html>
